services:
  ktrends:
    build: .
    container_name: ktrends
    image: falconchen/ktrends:${PLATFORM:-arm64}-latest
    volumes:
      - ./:/app
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://hicms.eu.org/mcp}
      - AUTH0_ISSUER=${AUTH0_ISSUER:-}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-https://hicms.eu.org/mcp}
      - AUTH0_REQUIRED_SCOPE=${AUTH0_REQUIRED_SCOPE:-ktrends:invoke}
      - AUTH0_ALLOWED_SUBJECT=${AUTH0_ALLOWED_SUBJECT:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
