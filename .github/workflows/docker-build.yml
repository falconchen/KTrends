name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!README.md'
      - '!.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: falconchen/ktrends:arm64-latest
          cache-from: type=registry,ref=falconchen/ktrends:arm64-latest
          cache-to: type=inline

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: falconchen/ktrends:amd64-latest
          cache-from: type=registry,ref=falconchen/ktrends:amd64-latest
          cache-to: type=inline

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t falconchen/ktrends:latest \
            falconchen/ktrends:amd64-latest \
            falconchen/ktrends:arm64-latest
