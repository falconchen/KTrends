  <style>
    body {
      background-color: #f8f9fa;
      /*padding-top: 70px;*/
    }

    .container {
      max-width: 800px;
      margin-top: 30px;
    }

    .tab-content {
      background-color: #fff;
      border: 1px solid #dee2e6;
      border-top: none;
      border-radius: 0 0 0.25rem 0.25rem;
      padding: 20px;
    }

    .nav-tabs .nav-link {
      display: flex;
      align-items: center;
    }

    .nav-tabs .nav-link ion-icon {
      margin-right: 5px;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9f7ef;
      border-radius: 4px;
      display: none;
      position: relative;
      word-wrap: break-word;

    }

    .copy-button {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      background-color: #fff;
      border-radius: 4px;
      padding: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .copy-button:hover {
      background-color: #f0f0f0;
    }

    .copy-button.copied {
      background-color: #28a745;
      color: white;
    }

    .copy-button ion-icon {}

    .alert-container {
      position: absolute;
      top: 1rem;
      left: 0;
      right: 0;
      z-index: 1050;
      display: flex;
      justify-content: center;
      width: 100%;

    }

    .alert {
      margin-bottom: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;

      max-width: 500px;
      width: 100%;

    }

    .alert.show {
      opacity: 1;
    }

    h1.page-title {
      margin-top: 20px;
    }

    .alert ion-icon {
      margin-right: 5px;
    }
  </style>
  <script type="module" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js"></script>

<body>
  <div class="alert-container"></div>
  <div class="container">

    <h1 class="text-left mb-4 page-title">
      <!-- <ion-icon name="bulb-outline"></ion-icon> -->
      <img src="/static/images/icon.png" style="width:2rem;filter: grayscale(1);">
      AI内容助手
    </h1>

    <ul class="nav nav-tabs" id="myTab" role="tablist">


      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="translation-tab" data-bs-toggle="tab" data-bs-target="#translation"
          type="button" role="tab" aria-controls="translation" aria-selected="true">
          <ion-icon name="globe-outline"></ion-icon> 翻译助手
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="summary-tab" data-bs-toggle="tab" data-bs-target="#summary" type="button"
          role="tab" aria-controls="summary" aria-selected="false">
          <ion-icon name="document-text-outline"></ion-icon> 内容摘要
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="keywords-tab" data-bs-toggle="tab" data-bs-target="#keywords" type="button"
          role="tab" aria-controls="keywords" aria-selected="false">
          <ion-icon name="pricetags-outline"></ion-icon> 关键词
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="social-tab" data-bs-toggle="tab" data-bs-target="#social" type="button" role="tab"
          aria-controls="social" aria-selected="false">
          <ion-icon name="share-social-outline"></ion-icon> 社交推文
        </button>
      </li>
    </ul>

    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade" id="keywords" role="tabpanel" aria-labelledby="keywords-tab">
        <div class="mb-3">
          <textarea class="form-control content-input" id="keywords-content" rows="6"
            placeholder="请输入文章内容或URL..."></textarea>
        </div>
        <div class="mb-3 css-selector-input" id="keywords-css-selector-group" style="display: none;">
          <input type="text" class="form-control css-selector" id="keywords-css-selector"
            placeholder="请输入CSS选择器，如：div#article（非必填，留空由AI自行判断，填写则提取更准确）">
        </div>
        <div class="mb-3">
          <label for="keywords-language" class="form-label"><ion-icon name="language-outline"></ion-icon> 选择语言：</label>
          <select class="form-select language-select" id="keywords-language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁体中文（HK）</option>
            <option value="zh-TW">繁体中文（TW）</option>
            <option value="en">英文</option>
            <option value="jp">日文</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="keywords-count" class="form-label"><ion-icon name="list-outline"></ion-icon> 关键词数量：</label>
          <input type="number" class="form-control" id="keywords-count" min="1" max="20" value="5">
        </div>
        <button class="btn btn-primary" onclick="processKeywords()"><ion-icon name="key-outline"></ion-icon>
          提取关键词</button>
        <div id="keywords-result" class="result"></div>
      </div>

      <div class="tab-pane fade" id="social" role="tabpanel" aria-labelledby="social-tab">
        <div class="mb-3">
          <textarea class="form-control content-input" id="social-content" rows="6"
            placeholder="请输入文章内容或URL..."></textarea>
        </div>
        <div class="mb-3 css-selector-input" id="social-css-selector-group" style="display: none;">
          <input type="text" class="form-control css-selector" id="social-css-selector"
            placeholder="请输入CSS选择器，如：div#article（非必填，留空由AI自行判断，填写则提取更准确）">
        </div>
        <div class="mb-3">
          <label for="social-language" class="form-label"><ion-icon name="language-outline"></ion-icon> 选择语言：</label>
          <select class="form-select language-select" id="social-language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁体中文（HK）</option>
            <option value="zh-TW">繁体中文（TW）</option>
            <option value="en">英文</option>
            <option value="jp">日文</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="processSocial()"><ion-icon name="megaphone-outline"></ion-icon>
          生成社交推广文案</button>
        <div id="social-result" class="result"></div>
      </div>
      <div class="tab-pane fade" id="summary" role="tabpanel" aria-labelledby="summary-tab">
        <div class="mb-3">
          <textarea class="form-control content-input" id="summary-content" rows="6"
            placeholder="请输入文章内容或URL..."></textarea>
        </div>
        <div class="mb-3 css-selector-input" id="summary-css-selector-group" style="display: none;">
          <input type="text" class="form-control css-selector" id="summary-css-selector"
            placeholder="请输入CSS选择器，如：div#article（非必填，留空由AI自行判断，填写则提取更准确）">
        </div>
        <div class="mb-3">
          <label for="summary-language" class="form-label"><ion-icon name="language-outline"></ion-icon> 选择语言：</label>
          <select class="form-select language-select" id="summary-language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁体中文（HK）</option>
            <option value="zh-TW">繁体中文（TW）</option>
            <option value="en">英文</option>
            <option value="jp">日文</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="processSummary()"><ion-icon name="newspaper-outline"></ion-icon>
          生成摘要</button>
        <div id="summary-result" class="result"></div>
      </div>


      <!-- New Translation tab -->
      <div class="tab-pane fade show active" id="translation" role="tabpanel" aria-labelledby="translation-tab">
        <div class="mb-3">
          <textarea class="form-control content-input" id="translation-content" rows="6"
            placeholder="请输入需要翻译的文本..."></textarea>
        </div>
        <div class="mb-3">
          <label for="translation-language" class="form-label"><ion-icon name="language-outline"></ion-icon>
            目标语言：</label>
          <select class="form-select  language-select" id="translation-language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁体中文（HK）</option>
            <option value="zh-TW">繁体中文（TW）</option>
            <option value="en">英文</option>
            <option value="jp">日文</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="processTranslation()"><ion-icon name="globe-outline"></ion-icon>
          翻译</button>
        <div id="translation-result" class="result"></div>
      </div>


    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== 工具函数 =====

    function isURL(str) {
      return /^(https?:\/\/)/i.test(str.trim());
    }

    function setCookie(name, value, days = 30) {
      const expires = new Date(Date.now() + days * 86400000).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    // ===== Alert =====

    let currentAlert = null;

    function showAlert(message, type = "warning") {
      const container = document.querySelector(".alert-container");
      if (!container) return;

      if (currentAlert) currentAlert.remove();

      const el = document.createElement("div");
      el.className = `alert alert-${type} alert-dismissible fade`;
      el.innerHTML = `
    <ion-icon name="warning-outline"></ion-icon>
    ${message}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  `;

      container.appendChild(el);

      setTimeout(() => el.classList.add("show"), 10);
      setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 500);
      }, 2500);

      currentAlert = el;
    }

    // ===== 统一流处理器 =====

    let activeController = null;

    async function streamRequest(url, formData, resultDiv, title) {
      if (activeController) activeController.abort();

      activeController = new AbortController();

      resultDiv.style.display = "block";
      resultDiv.dataset.content = "";

      resultDiv.innerHTML = `
    <div class="copy-button" onclick="copyContent('${resultDiv.id}')">
      <ion-icon name="copy-outline"></ion-icon>
    </div>
    <h5>${title}</h5>
    <p class="stream-text"></p>
  `;

      const textEl = resultDiv.querySelector(".stream-text");

      try {
        const res = await fetch(url, {
          method: "POST",
          body: formData,
          signal: activeController.signal
        });

        if (!res.ok) throw new Error(res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;

            const data = line.slice(6);
            if (data === "[DONE]") return;

            try {
              const json = JSON.parse(data);
              if (json.content) {
                resultDiv.dataset.content += json.content;
                textEl.textContent = resultDiv.dataset.content;
              }
            } catch { }
          }
        }
      } catch (e) {
        if (e.name !== "AbortError") {
          console.error(e);
          showAlert("请求失败，请稍后重试", "danger");
          resultDiv.style.display = "none";
        }
      }
    }

    // ===== 业务函数 =====

    function processSummary() {
      const content = document.getElementById("summary-content").value.trim();
      const lang = document.getElementById("summary-language").value;
      const selector = document.getElementById("summary-css-selector").value.trim();
      const resultDiv = document.getElementById("summary-result");

      if (!content) return showAlert("请输入内容或URL");

      const fd = new FormData();
      fd.append("input", content);
      fd.append("lang", lang);
      if (isURL(content) && selector) fd.append("css_selector", selector);

      setCookie("summary-language", lang);

      streamRequest(
        "/api/stream/get_summary",
        fd,
        resultDiv,
        '<ion-icon name="document-text-outline"></ion-icon> 文章摘要'
      );
    }

    function processSocial() {
      const content = document.getElementById("social-content").value.trim();
      const lang = document.getElementById("social-language").value;
      const selector = document.getElementById("social-css-selector").value.trim();
      const resultDiv = document.getElementById("social-result");

      if (!content) return showAlert("请输入内容或URL");

      const fd = new FormData();
      fd.append("input", content);
      fd.append("lang", lang);
      if (isURL(content) && selector) fd.append("css_selector", selector);

      setCookie("social-language", lang);

      streamRequest(
        "/api/stream/get_social",
        fd,
        resultDiv,
        '<ion-icon name="megaphone-outline"></ion-icon> 社交推广文案'
      );
    }

    function processKeywords() {
      const content = document.getElementById("keywords-content").value.trim();
      const lang = document.getElementById("keywords-language").value;
      const count = document.getElementById("keywords-count").value;
      const selector = document.getElementById("keywords-css-selector").value.trim();
      const resultDiv = document.getElementById("keywords-result");

      if (!content) return showAlert("请输入内容或URL");

      const fd = new FormData();
      fd.append("input", content);
      fd.append("lang", lang);
      fd.append("num_keywords", count);
      if (isURL(content) && selector) fd.append("css_selector", selector);

      setCookie("keywords-language", lang);
      setCookie("keywords-count", count);

      streamRequest(
        "/api/stream/get_keywords",
        fd,
        resultDiv,
        '<ion-icon name="pricetags-outline"></ion-icon> 关键词'
      );
    }

    function processTranslation() {
      const content = document.getElementById("translation-content").value.trim();
      const lang = document.getElementById("translation-language").value;
      const resultDiv = document.getElementById("translation-result");

      if (!content) return showAlert("请输入需要翻译的文本");

      const fd = new FormData();
      fd.append("input", content);
      fd.append("lang", lang);

      setCookie("translation-language", lang);

      streamRequest(
        "/api/stream/get_translation",
        fd,
        resultDiv,
        '<ion-icon name="globe-outline"></ion-icon> 翻译结果'
      );
    }

    // ===== 复制 =====

    function copyContent(resultId) {
      const el = document.getElementById(resultId);
      const text = el.dataset.content || "";

      navigator.clipboard.writeText(text).then(() => {
        const btn = el.querySelector(".copy-button");
        const old = btn.innerHTML;

        btn.classList.add("copied");
        btn.innerHTML = `<ion-icon name="checkmark-circle-outline"></ion-icon>`;

        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = old;
        }, 1500);
      });
    }

    // ===== UI 同步 =====

    function syncInputs() {
      const contentInputs = document.querySelectorAll(".content-input");
      const selectorInputs = document.querySelectorAll(".css-selector");
      const languageSelects = document.querySelectorAll(".language-select");

      contentInputs.forEach(input => {
        input.addEventListener("input", e => {
          contentInputs.forEach(i => {
            if (i !== e.target) i.value = e.target.value;
          });

          const show = isURL(e.target.value);
          document.querySelectorAll(".css-selector-input").forEach(g => {
            g.style.display = show ? "block" : "none";
          });
        });
      });

      selectorInputs.forEach(input => {
        input.addEventListener("input", e => {
          selectorInputs.forEach(i => {
            if (i !== e.target) i.value = e.target.value;
          });
        });
      });

      languageSelects.forEach(select => {
        select.addEventListener("change", e => {
          languageSelects.forEach(s => {
            if (s !== e.target) s.value = e.target.value;
          });
        });
      });
    }

    // ===== 初始化 =====

    document.addEventListener("DOMContentLoaded", () => {
      const saved = [
        "summary-language",
        "social-language",
        "keywords-language",
        "translation-language"
      ];

      saved.forEach(id => {
        const v = getCookie(id);
        if (v && document.getElementById(id)) {
          document.getElementById(id).value = v;
        }
      });

      const count = getCookie("keywords-count");
      if (count) document.getElementById("keywords-count").value = count;

      syncInputs();
    });
  </script>
</body>

</html>
